<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bercian Air</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#10243b; --paper:#f4f7fa; --card:#ffffff; --line:#d5dde6; --muted:#5b6b7c;
  --brand:#0b5fa5; --accent:#ff8a1f; --on-brand:#ffffff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#e8eef5;--paper:#0c1824;--card:#13263a;--line:#27425c;--muted:#9bb0c4;}
}
:root[data-theme="dark"]{--ink:#e8eef5;--paper:#0c1824;--card:#13263a;--line:#27425c;--muted:#9bb0c4;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;line-height:1.55}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{display:flex;align-items:center}
.logo img{height:34px;width:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stage{background:radial-gradient(120% 140% at 50% 0%,#0b2a5a 0%,#011b3e 70%);border-radius:18px;padding:14px 16px;margin:0 0 18px;max-width:640px}
.stage img{display:block;width:100%;height:auto}
.logo i{width:30px;height:30px;border-radius:50% 50% 50% 8px;background:var(--brand);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;inset:8px 6px 8px 8px;background:var(--accent);clip-path:polygon(0 0,100% 50%,0 100%,25% 50%)}
nav a{margin-left:22px;text-decoration:none;font-weight:500;color:var(--muted)}
nav a:hover{color:var(--ink)}
.hero{padding:28px 0 48px}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;max-width:14ch;letter-spacing:-.02em}
.hero p{color:var(--muted);font-size:1.15rem;max-width:46ch;margin:16px 0 28px}
.search{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
label,.fld{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
.combo{position:relative}
.opts{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:260px;overflow:auto;margin:0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.opts[hidden]{display:none}
.opts li{padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--ink)}
.opts li.on,.opts li:hover{background:var(--brand);color:#fff}
.opts li.none{color:var(--muted);cursor:default;background:none}
select,input{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--accent);color:#031a26}
button:hover{filter:brightness(1.07)}
.tab[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
section{padding:36px 0}
h2{font-size:1.9rem;margin-bottom:18px}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:14px}
/* billetes estilo tarjeta de embarque */
.ticket{display:grid;grid-template-columns:1fr auto;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.t-main{padding:16px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.t-main b{font:700 1.7rem "Bricolage Grotesque",sans-serif;display:block}
.t-main small{color:var(--muted)}
.t-line{height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px);position:relative;text-align:center}
.t-line span{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--card);padding:0 8px;font-size:.8rem;color:var(--muted)}
.t-buy{padding:16px 22px;border-left:2px dashed var(--line);display:grid;place-items:center;gap:8px;text-align:center;min-width:140px}
.t-buy strong{font:700 1.5rem "Bricolage Grotesque",sans-serif}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.dest{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;color:var(--ink);display:grid;gap:4px}
.dest .code{font:800 1.6rem "Bricolage Grotesque",sans-serif;color:var(--brand)}
.dest small{color:var(--muted)}
.dest em{font-style:normal;font-weight:600}
.fleet{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.fleet>div{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fleet img{display:block;width:100%;aspect-ratio:760/220;object-fit:cover;background:#011b3e}
.fleet .tx{padding:12px 14px}
.fleet b{font-size:1.1rem}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.9rem}
dialog{border:0;border-radius:18px;padding:0;max-width:560px;width:calc(100% - 28px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,15,25,.6)}
.dlg{padding:22px;display:grid;gap:14px}
.pass{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.pass-top{background:var(--brand);color:var(--on-brand);padding:14px 18px;display:flex;justify-content:space-between;font-weight:700}
.pass-body{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pass-body small{color:var(--muted);display:block}
.pass-body b{font-size:1.15rem}
.route{grid-column:1/-1;display:flex;justify-content:space-between;font:800 2.4rem "Bricolage Grotesque",sans-serif}
.bars{height:46px;margin:0 18px 18px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px)}
@media (max-width:620px){.ticket{grid-template-columns:1fr}.t-buy{border-left:0;border-top:2px dashed var(--line)}.t-main{grid-template-columns:1fr;gap:10px}.t-line{height:18px;background:none}.t-line span{display:none}nav a{margin-left:12px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo"><img id="logoImg" alt="Bercian Air"><span id="brandName" class="sr"></span></div>
    <nav><a href="#vuelos">Vuelos</a><a href="#destinos">Rutas</a><a href="#flota">Flota</a></nav>
  </header>

  <main>
    <div class="hero">
      <h1 id="tagline"></h1>
      <p id="subtitle"></p>
      
      <form class="search" id="searchForm">
        <div class="fld"><span>Origen</span><div class="combo"><input id="from" role="combobox" aria-label="Origen" aria-expanded="false" aria-controls="fromList" autocomplete="off" placeholder="Escribe una ciudad o código"><ul class="opts" id="fromList" role="listbox" hidden></ul></div></div>
        <div class="fld"><span>Destino</span><div class="combo"><input id="to" role="combobox" aria-label="Destino" aria-expanded="false" aria-controls="toList" autocomplete="off" placeholder="Escribe una ciudad o código"><ul class="opts" id="toList" role="listbox" hidden></ul></div></div>
        <label>Fecha<input type="date" id="date" required></label>
        <label>Pasajeros<select id="pax"></select></label>
        <label>Cabina<select id="cabin"></select></label>
        <button type="submit">Buscar vuelos</button>
      </form>
    </div>

    <section id="vuelos">
      <h2>Vuelos disponibles</h2>
      <div id="results"><p class="empty">Elige origen, destino y fecha para ver los vuelos de ese día.</p></div>
    </section>

    <section id="destinos">
      <h2>Rutas más demandadas</h2>
      <div class="grid" id="destGrid"></div>
    </section>

    <section id="flota">
      <h2>Nuestra flota</h2>
      <div class="fleet" id="fleetList"></div>
    </section>
  </main>

  <footer id="foot"></footer>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

  BCN: `Lanzarote,ACE,3;Adís Abeba,ADD,6;Málaga,AGP,1;Alghero,AHO,2;Ajaccio,AJA,2;Alicante,ALC,1;Argel,ALG,2;Ámsterdam,AMS,3;Atenas,ATH,4;Berlín,BER,3;Bastia,BIA,2;Bilbao,BIO,1;Biarritz,BIQ,2;Bejaia,BJA,3;Badajoz,BJZ,1;Bolonia,BLQ,2;Burdeos,BOD,2;Bruselas,BRU,3;Budapest,BUD,3;Béziers,BZR,2;Cagliari,CAG,2;Carcassonne,CCF,2;París Charles de Gaulle,CDG,3;Castellón,CDT,1;Cannes,CEQ,3;Calvi,CLY,2;Copenhague,CPH,3;Cancún,CUN,7;Doha,DOH,6;Dublín,DUB,3;Düsseldorf,DUS,3;Dubái,DXB,6;San Sebastián,EAS,1;Elba,EBA,3;Faro,FAO,2;Roma (Fiumicino),FCO,3;Fort Lauderdale,FLL,6;Funchal,FNC,3;Nimes,FNI,2;Fráncfort,FRA,3;Figari,FSC,2;Fuerteventura,FUE,3;Gibraltar,GIB,1;Girona,GRO,1;Granada,GRX,1;Hamburgo,HAM,3;Ibiza,IBZ,2;Lleida,ILD,1;Estambul,IST,4;Nueva York,JFK,6;Las Vegas,LAS,7;Larnaca,LCA,5;A Coruña,LCG,1;Tarbes,LDE,2;Almería,LEI,1;León,LEN,1;Londres Gatwick,LGW,3;Londres Heathrow,LHR,3;Lima,LIM,7;Lisboa,LIS,2;Gran Canaria,LPA,3;Madrid,MAD,1;Mahón,MAH,2;Manchester,MAN,3;Montpellier,MPL,2;Marsella,MRS,2;Múnich,MUC,3;Milán Malpensa,MXP,3;Nápoles,NAP,3;Niza,NCE,2;Nantes,NTE,3;Córdoba,ODB,1;Olbia,OLB,2;Oporto,OPO,2;Orán,ORN,3;París Orly,ORY,3;Asturias,OVD,1;Perpiñán,PGF,2;Palma de Mallorca,PMI,1;Palermo,PMO,3;Pamplona,PNA,1;Praga,PRG,3;Pisa,PSA,2;Pau,PUF,2;Porto Santo,PXO,4;Reus,REU,1;Logroño,RJL,1;Murcia,RMU,1;Santiago de Compostela,SCQ,1;Santander,SDR,1;Sevilla,SVQ,1;Tenerife Sur,TFS,3;Tenerife Norte,TFN,3;Tlemcen,TLM,3;Toulon,TLN,2;Toulouse,TLS,2;Tampa,TPA,6;Venecia,VCE,2;Vigo,VGO,1;Viena,VIE,3;Vitoria,VIT,1;Valencia,VLC,1;Valladolid,VLL,1;Jerez,XRY,1;Hamilton (Canadá),YHM,6;Ottawa,YOW,6;Zaragoza,ZAZ,1;Zúrich,ZRH,2`
};
// Clases de cabina: mult = multiplicador de precio sobre la tarifa de turista
const CABINS = [
  { id: "Y", name: "Turista", mult: 1 },
  { id: "W", name: "Premium Economy", mult: 1.6 },
  { id: "J", name: "Business", mult: 2.8 },
  { id: "F", name: "Primera clase", mult: 4.5 }
];

// Flota: units = aviones, letters = letras de asiento por fila, cabins = asientos por clase
const FLEET = {
  A321: { name: "Airbus A321neo", units: 107, letters: "ABCDEF", cabins: { Y: 166, W: 8 } },
  B777: { name: "Boeing 777-300", units: 40, letters: "ABCDEFGHJK", cabins: { Y: 290, W: 32, J: 30, F: 12 } },
  A350: { name: "Airbus A350-1000", units: 31, letters: "ABCDEFGHJ", cabins: { Y: 279, W: 21, J: 28, F: 8 } },
  E195: { name: "Embraer E195-E2", note: "Librea North Alliance", units: 15, letters: "ACDF", cabins: { Y: 100, W: 18 } }
};

// Qué aviones vuelan cada categoría de ruta (claves de FLEET)
const AIRCRAFT_BY_TIER = {
  1: ["E195", "A321"], 2: ["E195", "A321"], 3: ["A321"], 4: ["A321"], 5: ["A321"],
  6: ["B777", "A350"], 7: ["B777", "A350"]
};
// Rutas más demandadas que aparecen en la portada (formato ORIGEN-DESTINO, el origen es un hub)
const TOP_ROUTES = [
  "MAD-BCN", "MAD-PMI", "MAD-LHR", "MAD-JFK", "MAD-CDG", "MAD-LIS", "MAD-FCO",
  "MAD-MIA", "MAD-EZE", "MAD-MEX", "BCN-JFK", "BCN-LHR", "BCN-PMI", "BCN-AMS"
];
/* ================= fin de la configuración ================= */

const $ = id => document.getElementById(id);
const fmtMoney = n => n.toLocaleString("es-ES", { maximumFractionDigits: 0 }) + " " + CONFIG.currency;

// Procesar rutas
const NET = {}, AP = {};
HUBS.forEach(h => AP[h.code] = h.city);
for (const h of HUBS) {
  NET[h.code] = ROUTES_TXT[h.code].split(";").map(s => s.trim()).filter(Boolean).map(s => {
    const [city, code, tier, price, hours] = s.split(",");
    return { city, code, tier: +tier, price: price ? +price : null, hours: hours ? +hours : null };
  }).sort((a, b) => a.city.localeCompare(b.city, "es"));
  NET[h.code].forEach(r => { if (!AP[r.code]) AP[r.code] = r.city; });
}

// Marca
document.documentElement.style.setProperty("--brand", CONFIG.colors.brand);
document.documentElement.style.setProperty("--accent", CONFIG.colors.accent);
document.title = CONFIG.name;
$("brandName").textContent = CONFIG.name;
$("logoImg").src = ASSETS.logo;

$("tagline").textContent = CONFIG.tagline;
$("subtitle").textContent = CONFIG.subtitle;
$("foot").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name + ". " + CONFIG.footer;

// Selectores: el destino depende del origen (todo vuelo pasa por un hub)
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
// Cuadro de texto con sugerencias: escribe y elige de la lista (ignora tildes y mayúsculas)
function makeCombo(id, getItems, onPick) {
  const inp = $(id), ul = $(id + "List");
  let code = null, idx = 0, shown = [];
  const label = it => it.city + " (" + it.code + ")";
  const matches = () => { const q = norm(inp.value.trim()); return getItems().filter(it => !q || norm(it.city + " " + it.code).includes(q)); };
  const close = () => { ul.hidden = true; inp.setAttribute("aria-expanded", "false"); };
  const pick = it => { code = it.code; inp.value = label(it); close(); onPick(); };
  function render() {
    shown = matches().slice(0, 40); idx = 0;
    ul.innerHTML = shown.length ? shown.map((it, i) => `<li role="option" data-i="${i}"${i === 0 ? ' class="on"' : ''}>${label(it)}</li>`).join("") : `<li class="none">Sin resultados</li>`;
    ul.hidden = false; inp.setAttribute("aria-expanded", "true");
  }
  inp.addEventListener("input", () => { code = null; render(); });
  inp.addEventListener("focus", () => { inp.select(); render(); });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (ul.hidden) render();
      idx = (idx + (e.key === "ArrowDown" ? 1 : -1) + shown.length) % (shown.length || 1);
      [...ul.children].forEach((li, i) => li.classList.toggle("on", i === idx));
      if (ul.children[idx]) ul.children[idx].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter" && !ul.hidden && shown[idx]) { e.preventDefault(); pick(shown[idx]); }
    else if (e.key === "Escape") close();
  });
  ul.addEventListener("mousedown", e => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); pick(shown[+li.dataset.i]); } });
  inp.addEventListener("blur", () => { if (!code && inp.value.trim()) { const m = matches(); if (m.length === 1) { pick(m[0]); return; } } close(); });
  return {
    get code() { return code; },
    set(c) { const it = getItems().find(x => x.code === c); code = it ? c : null; inp.value = it ? label(it) : ""; }
  };
}
const others = Object.keys(AP).filter(c => !NET[c]).sort((a, b) => AP[a].localeCompare(AP[b], "es"));
const allFrom = [...HUBS, ...others.map(c => ({ code: c, city: AP[c] }))];
const fromBox = makeCombo("from", () => allFrom, () => fillTo(toBox.code));
const toBox = makeCombo("to", () => dests(fromBox.code), () => {});
function dests(f) {
  return NET[f] ? NET[f] : HUBS.filter(h => NET[h.code].some(r => r.code === f)).map(h => ({ code: h.code, city: h.city }));
}
function fillTo(keep) {
  const list = dests(fromBox.code);
  toBox.set(keep && list.some(r => r.code === keep) ? keep : null);
  
}

fromBox.set(HUBS[0].code);
fillTo(NET[HUBS[0].code][0].code);
$("pax").innerHTML = Array.from({ length: CONFIG.maxPassengers }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("");
$("cabin").innerHTML = CABINS.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
const d0 = new Date(); d0.setDate(d0.getDate() + 7);
$("date").value = d0.toISOString().slice(0, 10);
$("date").min = new Date().toISOString().slice(0, 10);

// Rutas más demandadas (se editan en TOP_ROUTES)
$("destGrid").innerHTML = TOP_ROUTES.map(p => {
  const [a, b] = p.split("-");
  if (!NET[a] || !NET[a].some(r => r.code === b)) return "";
  return `<button class="dest" data-from="${a}" data-to="${b}"><span class="code">${a} – ${b}</span><b>${AP[a]} → ${AP[b]}</b><em>Desde ${fmtMoney(routeInfo(a, b).price)}</em></button>`;
}).join("");
$("destGrid").addEventListener("click", e => {
  const b = e.target.closest(".dest"); if (!b) return;
  fromBox.set(b.dataset.from); fillTo(b.dataset.to);
  $("searchForm").scrollIntoView({ block: "center" });
  $("searchForm").requestSubmit();
});

// Cálculo de ruta
function routeInfo(from, to) {
  const hub = NET[from] ? from : to, other = NET[from] ? to : from;
  const r = NET[hub].find(x => x.code === other), t = TIERS[r.tier];
  return { hours: r.hours || t.h, price: r.price || t.p, n: t.n, tier: r.tier };
}
const addMin = (t, m) => { const [h, mi] = t.split(":").map(Number); const x = (h * 60 + mi + m) % 1440; return String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0"); };
const rnd = (seed, n) => { let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0; return s % n; };

let current = [];
$("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const from = fromBox.code, to = toBox.code, box = $("results");
  if (!from || !to) { box.innerHTML = `<p class="empty">Escribe el origen y el destino y elige una opción de la lista.</p>`; return; }
  const { hours, price, n, tier } = routeInfo(from, to);
  const pax = +$("pax").value, cab = CABINS.find(c => c.id === $("cabin").value), date = $("date").value;
  const mins = Math.round(hours * 60);
  const pool = AIRCRAFT_BY_TIER[tier];
  current = CONFIG.departures.slice(0, n).map((dep, i) => ({
    ac: FLEET[pool[rnd(from + to + i, pool.length)]],
    no: CONFIG.code + (100 + rnd(from + to + i, 800)),
    dep, arr: addMin(dep, mins), mins, a: { code: from, city: AP[from] }, b: { code: to, city: AP[to] }, date, pax, cab,
    total: price * CONFIG.priceByDeparture[i] * cab.mult * pax
  })).filter(f => f.ac.cabins[cab.id]);
  current.forEach(f => { f.left = 2 + rnd(f.no + date + cab.id, Math.max(3, Math.round(f.ac.cabins[cab.id] * 0.5))); });
  if (!current.length) {
    const av = CABINS.filter(c => pool.some(k => FLEET[k].cabins[c.id])).map(c => c.name).join(", ");
    box.innerHTML = `<p class="empty">${cab.name} no está disponible en esta ruta. Cabinas que opera: ${av}.</p>`;
    return;
  }
  box.innerHTML = current.map((f, i) => `
    <article class="ticket">
      <div class="t-main">
        <div><b>${f.dep}</b><small>${f.a.city} · ${f.a.code}</small></div>
        <div class="t-line"><span>${Math.floor(f.mins / 60)} h ${String(f.mins % 60).padStart(2, "0")} min</span></div>
        <div style="text-align:right"><b>${f.arr}</b><small>${f.b.city} · ${f.b.code}</small></div>
      </div>
      <div class="t-buy"><small>${f.no} · ${f.ac.name}</small><small>${f.cab.name} · ${pax} pas.</small><strong>${fmtMoney(f.total)}</strong><small>${f.left >= pax ? "Quedan " + f.left + " asientos" : "Solo quedan " + f.left}</small><button data-i="${i}"${f.left < pax ? " disabled" : ""}>Reservar</button></div>
    </article>`).join("");
});

// Reserva
const dlg = $("dlg"), body = $("dlgBody");
$("results").addEventListener("click", e => {
  const b = e.target.closest("button[data-i]"); if (!b) return;
  const f = current[+b.dataset.i];
  body.innerHTML = `
    <h2 style="margin:0">Datos del pasajero</h2>
    <p style="margin:0;color:var(--muted)">${f.a.city} → ${f.b.city} · ${f.no} · ${fmtMoney(f.total)}</p>
    <label>Nombre completo<input id="pname" autocomplete="name" placeholder="Nombre y apellidos"></label>
    <p id="perr" style="margin:0;color:#c0392b" hidden>Escribe el nombre del pasajero para continuar.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="ghost" id="cancel">Cancelar</button><button id="confirm">Confirmar reserva</button></div>`;
  dlg.showModal(); $("pname").focus();
  $("cancel").onclick = () => dlg.close();
  $("confirm").onclick = () => {
    const name = $("pname").value.trim();
    if (!name) { $("perr").hidden = false; return; }
    showPass(f, name);
  };
});

// Asiento según la distribución del avión: primera delante, turista detrás
function seatFor(f, name) {
  const ac = f.ac; let row = 1;
  for (const c of CABINS.slice().reverse()) {
    const n = ac.cabins[c.id] || 0;
    if (c.id === f.cab.id) {
      const k = rnd(name + f.no, Math.max(n, 1));
      return (row + Math.floor(k / ac.letters.length)) + ac.letters[k % ac.letters.length];
    }
    row += Math.ceil(n / ac.letters.length);
  }
}

function showPass(f, name) {
  const seat = seatFor(f, name);
  const gate = "ABC"[rnd(f.no, 3)] + (1 + rnd(f.dep + f.no, 24));
  const boarding = addMin(f.dep, -40);
  const loc = (f.no + name).replace(/[^A-Z0-9]/gi, "").toUpperCase().slice(-6).padEnd(6, "X");
  body.innerHTML = `
    <h2 style="margin:0">Reserva confirmada</h2>
    <div class="pass">
      <div class="pass-top"><span>${CONFIG.name} · ${f.ac.name}</span><span>${f.no}</span></div>
      <div class="pass-body">
        <div class="route"><span>${f.a.code}</span><span>→</span><span>${f.b.code}</span></div>
        <div><small>Pasajero</small><b>${name.replace(/</g, "&lt;")}</b></div>
        <div><small>Fecha</small><b>${new Date(f.date + "T12:00").toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" })}</b></div>
        <div><small>Salida / Llegada</small><b>${f.dep} / ${f.arr}</b></div>
        <div><small>Embarque</small><b>${boarding}</b></div>
        <div><small>Puerta</small><b>${gate}</b></div>
        <div><small>Asiento</small><b>${seat}</b></div>
        <div><small>Cabina</small><b>${f.cab.name}</b></div>
        <div><small>Localizador</small><b>${loc}</b></div>
      </div>
      <div class="bars" aria-hidden="true"></div>
    </div>
    <div style="display:flex;justify-content:flex-end"><button id="done">Cerrar</button></div>`;
  $("done").onclick = () => dlg.close();
}

// Flota
$("fleetList").innerHTML = Object.entries(FLEET).map(([k, f]) => {
  const tot = Object.values(f.cabins).reduce((a, b) => a + b, 0);
  return `<div><img src="${ASSETS[k]}" alt="${f.name} con la librea de Bercian Air" loading="lazy"><div class="tx"><b>${f.name}</b><br><small>${f.units} aviones · ${tot} asientos${f.note ? " · " + f.note : ""}</small><br><small>${CABINS.filter(c => f.cabins[c.id]).map(c => c.name + " " + f.cabins[c.id]).join(" · ")}</small></div></div>`;
}).join("");
</script>
